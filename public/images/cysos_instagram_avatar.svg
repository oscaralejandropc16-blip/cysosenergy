<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- Crisp Pure White Circle Background -->
  <circle cx="160" cy="160" r="160" fill="#FFFFFF" />
  
  <g transform="translate(18, 25)">
    <!-- Droplet Flame Icon on the Left -->
    <g transform="translate(15, 60) scale(0.95)">
      <!-- Outer Charcoal Metallic Droplet -->
      <path
        d="M 58 10 C 30 45 10 75 10 98 C 10 120 28 135 55 135 C 40 130 25 115 25 95 C 25 75 42 50 60 20 Z"
        fill="#262626"
      />
      <!-- Silver Highlight Line -->
      <path
        d="M 59 18 C 42 45 27 72 27 92 C 27 110 38 123 52 130 C 42 122 34 108 34 93 C 34 76 47 52 61 24 Z"
        fill="#525252"
        opacity="0.8"
      />
      <!-- Flame Outer (Orange) -->
      <path
        d="M 60 25 C 85 55 110 78 110 100 C 110 122 92 135 65 135 C 85 130 96 115 96 97 C 96 78 78 52 60 25 Z"
        fill="#EA580C"
      />
      <!-- Flame Mid (Amber) -->
      <path
        d="M 60 38 C 78 62 95 82 95 102 C 95 120 80 132 60 135 C 75 128 83 115 83 100 C 83 83 69 60 60 38 Z"
        fill="#F59E0B"
      />
      <!-- Flame Core (Bright Gold/Yellow) -->
      <path
        d="M 60 52 C 72 70 82 86 82 103 C 82 118 72 130 58 134 C 68 126 73 115 73 102 C 73 88 63 68 60 52 Z"
        fill="#FACC15"
      />
    </g>

    <!-- Official Typography on the Right -->
    <text
      x="132"
      y="152"
      font-family="system-ui, -apple-system, 'Outfit', 'Inter', sans-serif"
      font-size="44"
      font-weight="900"
      letter-spacing="-0.5px"
      fill="#0F172A"
    >CYSOS</text>
    
    <text
      x="134"
      y="178"
      font-family="system-ui, -apple-system, 'Outfit', 'Inter', sans-serif"
      font-size="14.5"
      font-weight="900"
      letter-spacing="3.2px"
      fill="#EA580C"
    >ENERGY, C.A.</text>
  </g>
</svg>
